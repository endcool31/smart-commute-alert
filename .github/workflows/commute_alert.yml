name: Smart Commute Alert

on:
  workflow_dispatch: # 支援手動觸發執行
  schedule:
    # 平日上午 7:00 CST -> 週日至週四 UTC 23:00 (cron: 分 時 日 月 星期)
    - cron: '0 23 * * 0-4'

jobs:
  run-alert:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 執行通勤通報腳本
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          python main.py
